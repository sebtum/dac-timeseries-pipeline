name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install -r requirements.txt
      - run: ruff check .
      - run: ruff format --check .
      # The shape of ingest_summary.json is a contract (M2). Its committed example must
      # validate against the schema; the ingest's own output is validated in the tests.
      - name: Validate the ingest summary contract example
        run: >-
          check-jsonschema
          --schemafile contracts/ingest_summary.schema.json
          contracts/examples/ingest_summary.example.json
      # Same for the post-ingest profile (M2.5); the committed real profile is validated in
      # tests/unit/test_profiling.py and the fixture run's output in tests/e2e/test_profile_cli.py.
      - name: Validate the post-ingest profile contract example
        run: >-
          check-jsonschema
          --schemafile contracts/post_ingest_profile.schema.json
          contracts/examples/post_ingest_profile.example.json
      # Same for the cleaning summary (M3); the fixture run's output is validated in
      # tests/e2e/test_clean_cli.py. The real-data clean and rollup are not run in CI (the
      # rollup alone takes about 12 minutes).
      - name: Validate the cleaning summary contract example
        run: >-
          check-jsonschema
          --schemafile contracts/cleaning_summary.schema.json
          contracts/examples/cleaning_summary.example.json
      # Same for the metrics summary (M4); the fixture run's output is validated in
      # tests/e2e/test_metrics_cli.py. The real-data metrics run is not run in CI.
      - name: Validate the metrics summary contract example
        run: >-
          check-jsonschema
          --schemafile contracts/metrics_summary.schema.json
          contracts/examples/metrics_summary.example.json
      # Same for the comparison summary (M5); the fixture run's output is validated in
      # tests/e2e/test_compare_cli.py. The real-data comparison run is not run in CI.
      - name: Validate the comparison summary contract example
        run: >-
          check-jsonschema
          --schemafile contracts/comparison_summary.schema.json
          contracts/examples/comparison_summary.example.json
      # Same for the dashboard check (M6); the checker's own output is validated in
      # tests/integration/test_grafana_stack.py. The lint of grafana/dashboards runs in the unit
      # suite (tests/unit/test_dashboards_lint.py), so it needs no service here.
      - name: Validate the dashboard check contract example
        run: >-
          check-jsonschema
          --schemafile contracts/dashboard_check.schema.json
          contracts/examples/dashboard_check.example.json

  integration:
    runs-on: ubuntu-latest
    # Postgres as a native Actions service container — GH waits for its healthcheck
    # before any step below runs, and fails the job outright if it never goes healthy.
    # Credentials match .env.example's defaults so bootstrap_influx_token.py's
    # .env-from-.env.example seeding needs no CI-specific override.
    services:
      postgres:
        image: postgres:16.6
        env:
          POSTGRES_DB: dac
          POSTGRES_USER: dac
          POSTGRES_PASSWORD: changeme_local_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dac -d dac"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install -r requirements.txt

      # InfluxDB 3 Core is not brought up via the `services:` block: its entrypoint
      # (`influxdb3 serve`) requires --node-id/--object-store/--data-dir with no
      # defaults (docs/spikes/U-13-core-token-bootstrap.md), and Actions service
      # containers can't pass a command past the image's own entrypoint. Started as a
      # plain `docker run` instead, with the exact flags the spike verified —
      # including --disable-authz health, so the wait loop below needs no token.
      - name: Start InfluxDB 3 Core
        run: |
          docker run -d --name dac-influxdb \
            -p 8181:8181 \
            influxdb:3.11.2-core \
            influxdb3 serve \
              --node-id node1 \
              --object-store file \
              --data-dir /var/lib/influxdb3/data \
              --disable-authz health

      - name: Wait for InfluxDB to become reachable
        run: |
          timeout 60 bash -c \
            'until curl -sf http://localhost:8181/health >/dev/null; do sleep 2; done'

      - name: Bootstrap InfluxDB admin token
        run: python scripts/bootstrap_influx_token.py

      - name: Run Postgres migrations
        run: python -m scripts.migrate

      - name: Initialize InfluxDB databases
        run: python scripts/init_influx.py

      # Grafana (M6), last of the services: it reads the token once, at start, so it comes after
      # the bootstrap, and its datasource on dac_raw is healthy only after the init above. Plain
      # `docker run --network host` with the same provisioning directory the compose file mounts
      # (decision 17): the stores are then at localhost, which is what .env.example's
      # GRAFANA_URL and the checker expect. The image tag is read from docker-compose.yml so the
      # pin lives in one place. grafana/dashboards may not exist yet, hence the mkdir.
      - name: Start Grafana
        run: |
          mkdir -p grafana/dashboards
          env_value() { grep -E "^$1=" .env | head -n1 | cut -d= -f2-; }
          image=$(grep -oE 'grafana/grafana:[0-9][0-9.]*' docker-compose.yml | head -n1)
          args=(-d --name dac-grafana --network host)
          args+=(-v "$PWD/grafana/provisioning:/etc/grafana/provisioning:ro")
          args+=(-v "$PWD/grafana/dashboards:/var/lib/grafana/dashboards:ro")
          args+=(-e GF_SECURITY_ADMIN_USER="$(env_value GRAFANA_ADMIN_USER)")
          args+=(-e GF_SECURITY_ADMIN_PASSWORD="$(env_value GRAFANA_ADMIN_PASSWORD)")
          args+=(-e GF_AUTH_ANONYMOUS_ENABLED=false -e GF_USERS_ALLOW_SIGN_UP=false)
          args+=(-e GF_ANALYTICS_REPORTING_ENABLED=false -e GF_ANALYTICS_CHECK_FOR_UPDATES=false)
          args+=(-e DAC_INFLUX_URL=http://localhost:8181 -e DAC_POSTGRES_HOST=localhost:5432)
          args+=(-e INFLUX_TOKEN="$(env_value INFLUX_TOKEN)")
          args+=(-e POSTGRES_DB="$(env_value POSTGRES_DB)")
          args+=(-e POSTGRES_USER="$(env_value POSTGRES_USER)")
          args+=(-e POSTGRES_PASSWORD="$(env_value POSTGRES_PASSWORD)")
          docker run "${args[@]}" "$image"

      - name: Wait for Grafana and both datasources
        run: |
          user=$(grep -E '^GRAFANA_ADMIN_USER=' .env | cut -d= -f2-)
          password=$(grep -E '^GRAFANA_ADMIN_PASSWORD=' .env | cut -d= -f2-)
          base=http://localhost:3000
          wait_for() {
            for _ in $(seq 1 60); do
              if "$@" >/dev/null 2>&1; then return 0; fi
              sleep 2
            done
            return 1
          }
          wait_for curl -sf "$base/api/health"
          for uid in influx-dac pg-dac; do
            wait_for bash -c "curl -sf -u '$user:$password' $base/api/datasources/uid/$uid/health | grep -q OK"
          done

      # `pytest` from the repo root also runs tests/e2e: the real ingest, profile, clean and
      # metrics CLIs (and the rollup) against this InfluxDB and Postgres, on the committed fixtures
      # (tests/fixtures/ingest, profile, clean, metrics), into throwaway databases and a throwaway
      # Postgres schema. The clean tests
      # use one throwaway database and the rollup shares it, so the 5-database limit of Core
      # holds next to dac_raw, dac_rollup and dac_pinned.
      # A skip is a failure here: with both services live, every influx/postgres-marked
      # test should run for real. `pytest`'s own exit code doesn't reflect skips, so
      # the skip count is checked explicitly against the summary line.
      - name: Run tests
        run: |
          set -o pipefail
          python -m pytest -v 2>&1 | tee pytest.log
          if grep -qE '[0-9]+ skipped' pytest.log; then
            echo "::error::pytest reported skipped tests with both services up — a service must be unreachable"
            exit 1
          fi

      - name: Dump InfluxDB and Grafana logs on failure
        if: failure()
        run: |
          docker logs dac-influxdb
          docker logs dac-grafana

      - name: Stop InfluxDB and Grafana
        if: always()
        run: docker rm -f dac-influxdb dac-grafana
